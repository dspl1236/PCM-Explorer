name: Build Windows exe

# Every code push to main rebuilds the exe and refreshes the rolling "latest"
# download. Pushing a version tag (v0.2.0, ...) additionally cuts a numbered
# release, and prunes older ones so the release page stays tidy.
#
# Tests run first -- a build that fails them never becomes a download.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# A newer push supersedes an in-flight build of the same ref.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Pinned deliberately: releases should not drift with whatever Python
          # happens to be current.
          python-version: "3.12"

      - name: Smoke tests
        run: python tests/test_smoke.py

      - name: CLI sanity check
        run: python explorer.py --help

      # The version in __init__.py is the source of truth. A tagged build must
      # match its tag, otherwise the download and the title bar would disagree.
      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = (python -c "import pcmexplorer; print(pcmexplorer.__version__)").Trim()
          $sha = "${{ github.sha }}".Substring(0,7)
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $tag = "${{ github.ref_name }}" -replace '^v',''
            if ($tag -ne $v) {
              Write-Error "tag v$tag does not match __version__ $v -- bump pcmexplorer/__init__.py"
              exit 1
            }
          }
          "version=$v"  | Out-File -Append $env:GITHUB_OUTPUT
          "commit=$sha" | Out-File -Append $env:GITHUB_OUTPUT
          Write-Host "version $v, commit $sha"

      # Stamp the build so a downloaded exe can name its exact commit.
      - name: Stamp build id
        shell: pwsh
        run: |
          "COMMIT = `"${{ steps.ver.outputs.commit }}`"" |
            Out-File -Encoding ascii pcmexplorer\_build.py
          python -c "import pcmexplorer; print('stamped:', pcmexplorer.version_string())"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build
        # --windowed: no console window behind the UI. The exe is the desktop
        # app; the CLI is for people running from source.
        run: >
          pyinstaller --onefile --windowed
          --name PCM-Explorer
          --collect-submodules pcmexplorer
          explorer.py

      # A second, version-named copy. PCM-Explorer.exe keeps its stable name so
      # the rolling download link in the README never breaks; the versioned copy
      # is what people keep alongside an image they are archiving.
      - name: Versioned copy
        shell: pwsh
        run: |
          Copy-Item dist\PCM-Explorer.exe `
            "dist\PCM-Explorer-${{ steps.ver.outputs.version }}.exe"

      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\PCM-Explorer.exe -Algorithm SHA256).Hash
          "$h  PCM-Explorer.exe" | Out-File -Encoding ascii dist\PCM-Explorer.exe.sha256
          Write-Host "SHA256: $h"
          $mb = [math]::Round((Get-Item dist\PCM-Explorer.exe).Length / 1MB, 1)
          Write-Host "Size: $mb MB"

      - uses: actions/upload-artifact@v4
        with:
          name: PCM-Explorer-windows
          path: |
            dist/PCM-Explorer.exe
            dist/PCM-Explorer.exe.sha256
          retention-days: 14

      # --- rolling build from main: one download, always current ---
      - name: Update "latest" build
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build from main
          prerelease: true
          files: |
            dist/PCM-Explorer.exe
            dist/PCM-Explorer.exe.sha256
          body: |
            Automatic build of the latest `main`.

            **Version ${{ steps.ver.outputs.version }}, build `${{ steps.ver.outputs.commit }}`** —
            the app shows this in its title bar and `--version`, so a bug report
            can name the exact build.

            No Python needed — download and run. The exe is unsigned, so
            SmartScreen will warn on first run: **More info → Run anyway**.
            Verify against the published SHA256 if you prefer, or run from source.

            For a stable numbered build, see the releases below.

      # --- tagged release ---
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: PCM Explorer ${{ steps.ver.outputs.version }}
          files: |
            dist/PCM-Explorer.exe
            dist/PCM-Explorer-${{ steps.ver.outputs.version }}.exe
            dist/PCM-Explorer.exe.sha256
          generate_release_notes: true
          body: |
            Standalone Windows build — no Python needed.
            **Version ${{ steps.ver.outputs.version }}** (build `${{ steps.ver.outputs.commit }}`).

            Two identical binaries: `PCM-Explorer.exe` for the stable download
            link, and `PCM-Explorer-${{ steps.ver.outputs.version }}.exe` if you
            want the version in the filename.

            The exe is unsigned, so SmartScreen will warn on first run:
            **More info → Run anyway**. Verify against the published SHA256
            if you prefer, or run from source.

  # Keep the release page tidy: retain the 3 newest versioned releases.
  # Tags are left alone (they cost nothing and preserve history); only the
  # older binaries are removed.
  prune:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete releases older than the 3 newest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          keep=3
          mapfile -t old < <(
            gh release list --limit 100 --json tagName,isPrerelease,createdAt \
              --jq 'map(select(.isPrerelease == false and (.tagName | startswith("v"))))
                    | sort_by(.createdAt) | reverse | .['"$keep"':][] | .tagName'
          )
          if [ ${#old[@]} -eq 0 ]; then
            echo "Nothing to prune (keeping the $keep newest)."
            exit 0
          fi
          for tag in "${old[@]}"; do
            echo "Deleting release $tag (tag retained)"
            gh release delete "$tag" --yes
          done
